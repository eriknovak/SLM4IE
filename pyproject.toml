[project]
name = "slm4ie"
version = "0.1.0"
description = "Small language models for zero-shot information extraction in European languages"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The repo itself: reading configs and building the experiments report. Every
# workstream beyond that is a dependency group below.
dependencies = [
    "pyyaml>=6.0",                    # every config, and build_report.py frontmatter
    "markdown>=3.7",                  # experiments/build_report.py
    "tqdm>=4.66.0",                   # top-level import in slm4ie/data/parallel.py,
                                      #   which every group's code goes through
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py313"

# Formatter (black-compatible): `uv run ruff format <paths>`, check only with `--check`.
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
docstring-code-line-length = "dynamic"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["D104"]
# Vendored from the labflow skill; kept byte-identical so it stays diffable
# against upstream when the skill updates it.
"experiments/build_report.py" = ["D", "E", "F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: end-to-end pipeline runs; deselect with -m 'not slow'",
]

[dependency-groups]
# Dependency groups, not extras: this package is never installed from an index,
# so nothing needs them in published metadata. Groups can also include one
# another, which is how `tracking` is declared once and shared.
#
#   uv sync                      -> base + dev
#   uv sync --group corpus       -> + the curation pipeline
#   uv sync --all-groups         -> everything

# Installed by a bare `uv sync`.
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.6",
]

# MLflow, shared by every group below: each experiment logs its runs, and the
# data pipeline logs extract/task/corpus lineage. Imported lazily, so code
# paths that never track still run without it.
tracking = [
    "mlflow>=3.13.0",
]

# The shared data pipeline: download -> extract -> task conversion.
# `datasets` is what makes this group heavy; it is imported only by the
# HuggingFace source and extractor. Elsewhere (parallel.py's log quieting) it is
# imported lazily behind try/except ImportError, so the other groups do not need it.
data = [
    "requests>=2.31.0",               # slm4ie/data/sources/http.py
    "datasets>=3.0.0",                # HuggingFace source + extractor
    "zstandard>=0.22",                # compressed raw archives (slm4ie/data/extract.py)
    "lxml>=6.1.1",                    # TEI and MaCoCu extractors
]

# Building the pretraining corpus: scripts/curate_pretraining_corpus.py + slm4ie/data/curate/.
#
# datatrove is installed bare. Its `processing` and `multilingual` extras both
# pull in fasttext-numpy2-wheel (no Python 3.13 wheel, needs a C++17 compiler)
# via `pyidaungsu-numpy2` (Burmese), so the runtime deps we actually use are
# declared here instead.
corpus = [
    {include-group = "tracking"},
    "datatrove>=0.6.0",
    "orjson>=3.9",                    # required by JsonlReader / JsonlWriter
    "tokenizers>=0.20",               # imported by datatrove.pipeline.dedup.__init__
    "spacy>=3.8",                     # backs load_word_tokenizer("sl")
    "xxhash>=3.0",                    # HashConfig
    "fasteners>=0.19",                # stage runners
    "ftfy>=6.0",                      # TextNormConfig
    "regex>=2024.0",                  # text normalization
    "nltk>=3.8",                      # fallback sentence splitter
    "pyahocorasick>=2.0",             # filters
    "lingua-language-detector>=2.0.0",  # language stage + leakage diagnostic
    "numpy>=2.4.3",                   # seeded keep-fraction sampling in curate/spam.py
]

# Training and scoring tokenizers: scripts/sweep_tokenizers.py + slm4ie/tokenizers/.
tokenizers = [
    {include-group = "tracking"},
    "tokenizers>=0.20",               # HF BPE / WordPiece trainers + fast runtime
    "sentencepiece>=0.2.1",           # Unigram (SentencePiece) trainer
    "transformers>=4.45",             # PreTrainedTokenizerFast export + offsets
    "numpy>=2.4.3",                   # tokenizers/stats.py + analysis.py
]

# The showcase site (mkdocs.yml + website/); Material bundles the blog plugin.
docs = [
    "mkdocs-material>=9.7",
    "mkdocs-static-i18n>=1.3.1",
]

# Turning tracked runs into an experiment's tables and figures:
# each experiments/<category>/<slug>/analysis.py, via slm4ie/utils/mlflow_report.py.
analysis = [
    {include-group = "tracking"},
    "pandas>=2.2",                    # report tables from the MLflow store
    "datachart>=0.9.1",               # publication figures -> figures/*.svg
]
