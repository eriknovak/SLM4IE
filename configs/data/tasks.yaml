# tasks.yaml — Registry of <task>/<dataset> fine-tuning + evaluation targets.
#
# Pipeline: prepare_datasets.py tasks
#           extracted/<key>.jsonl | raw/<key>/ -> tasks/<task>/<dataset>/<split>.jsonl.gz
#           Output schemas are the task-family TypedDicts in slm4ie/data/schema.py.
#
# Top-level keys:
#   roots        extracted / raw / tasks — path roots for I/O.
#   mlflow       Tracking for task conversion (see Notes: mlflow).
#   workers      Optional; the process pool of the step. memory_per_worker_gb: peak
#                memory of one worker in GB (positive number; absent assumes 8 GB and
#                the run logs it). max_items_per_worker: items a worker handles before
#                it is replaced (positive integer; absent keeps workers for the run).
#   converters   Default converter backend per task family.
#   entries      Map of <task>/<dataset> -> entry spec. The key IS the output dir.
#
# Entry fields:
#   role         finetune_and_eval | held_out | finetune_only — enforces
#                train/test isolation. held_out drops the train split (writes
#                only val/test); the converter never emits a train.jsonl.gz for
#                a held_out entry. finetune_only keeps train for per-entry
#                fine-tuning, is isolated like held_out, and never enters a
#                zero-shot training mix.
#   source       kind (extracted | raw) + keys (source dataset keys) + optional
#                exclude (catalog keys whose documents are dropped by doc_id;
#                extracted only). A finetune_and_eval entry and a held_out or
#                finetune_only entry of one task may not share a key, nor may
#                one side's key contain (download.yaml `contains`) the other's
#                unless excluded; the registry fails to load otherwise.
#                Optional annotated_in (catalog keys whose annotations mark
#                which documents carry the layer: only doc_ids with entity
#                spans there are kept; extracted only). Optional
#                exclude_doc_ids (single doc_ids dropped, each with its reason
#                in a comment; extracted only).
#   split_on     Optional; assign splits from a document metadata field instead
#                of the id hash: field, values ({split: [field values]}),
#                otherwise (split for the rest, or a list of splits the rest is
#                hash-split across by document id). For a source with a
#                published split; `spans` and `pos` converters only.
#   splits       Split name -> output filename.
#   labels       Label set for the task; required except for the label-free
#                families `extractive_qa` and `keyphrase`.
#   suite        Parent benchmark suite, or null.
#   language     ISO language code.
#   license      Dataset license identifier.
#
# Notes:
#   converter    Per entry defaults from the `converters` map by task family;
#     override with a per-entry `converter:` field.
#   mlflow       When enabled, one run per <task>/<dataset> is upserted to
#     `experiment` (keyed by a content digest of the dataset's split files):
#     per-split row counts + label distribution as metrics, a
#     label_distribution.json artifact, and the dataset as a `produced` input.
#
# Selection: pass <task>/<dataset> entry keys positionally, or --all.

# Roots for resolving source paths and writing output.
roots:
  extracted: ./data/extracted
  tasks: ./data/tasks
  raw: ./data/raw

# --- MLflow -------------------------------------------------------------
mlflow:                           # see Notes: mlflow
  enabled: false                  # opt in per run; toggle --mlflow / --no-mlflow
  experiment: slm4ie/data/tasks
  tracking_uri: null              # null -> $MLFLOW_TRACKING_URI -> sqlite fallback

# Default converter per task family; override per entry with `converter:`.
converters:
  ner: spans
  pos: pos
  sentiment: sentiment
  nli: superglue
  qa: superglue
  coref: superglue
  wsd: superglue
  commonsense: superglue
  # converters not built yet; the loader does not resolve a name until a run
  relation: relation
  entity_sentiment: entity_sentiment
  extractive_qa: extractive_qa
  keyphrase: keyphrase
  reading_mc: reading_mc
  topic: topic

# Per <task>/<dataset> entries. The key IS the directory under tasks/.
entries:
  # --- Sequence labeling & classification -------------------------------
  ner/ssj500k:
    role: finetune_and_eval
    # only SUK's ssj500k-syn part carries NER; the rest is filled with O tags
    source: { kind: extracted, keys: [ssj500k], annotated_in: [suk] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [PER, LOC, ORG, MISC, DERIV-PER]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  ner/suk:
    role: finetune_only
    # SUK integrates ssj500k, which ner/ssj500k trains on; drop those documents.
    source: { kind: extracted, keys: [suk], exclude: [ssj500k] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [PER, LOC, ORG, MISC, DERIV-PER]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  ner/janes_tag:
    role: finetune_only
    source: { kind: extracted, keys: [janes_tag] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [PER, LOC, ORG, MISC, DERIV-PER]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  ner/slavicner:
    role: finetune_only
    # covid-19/sl/sl-124 is a municipality table read as one 5,425-character
    # sentence with 212 mentions; its answer outgrows the 2,048-token cap
    source: { kind: extracted, keys: [slavicner], exclude_doc_ids: [covid-19/sl/sl-124] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    # the paper's single-topic-out split: US Election 2020 is the test topic
    split_on: { field: topic, values: { test: [us_election_2020] }, otherwise: [train, val] }
    labels: [PER, ORG, LOC, EVT, PRO]
    suite: null
    language: sl
    license: research-only

  pos/ssj500k:
    role: finetune_and_eval
    source: { kind: extracted, keys: [ssj500k] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [ADJ, ADP, ADV, AUX, CCONJ, DET, INTJ, NOUN, NUM, PART, PRON, PROPN, PUNCT, SCONJ, SYM, VERB, X]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  pos/suk:
    role: finetune_only
    # SUK integrates ssj500k, which pos/ssj500k trains on; drop those documents.
    source: { kind: extracted, keys: [suk], exclude: [ssj500k] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [ADJ, ADP, ADV, AUX, CCONJ, DET, INTJ, NOUN, NUM, PART, PRON, PROPN, PUNCT, SCONJ, SYM, VERB, X]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  pos/janes_tag:
    role: finetune_only
    source: { kind: extracted, keys: [janes_tag] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [ADJ, ADP, ADV, AUX, CCONJ, DET, INTJ, NOUN, NUM, PART, PRON, PROPN, PUNCT, SCONJ, SYM, VERB, X]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  sentiment/sentinews:
    role: finetune_and_eval
    source: { kind: extracted, keys: [sentinews] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [negative, neutral, positive]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  sentiment/twitter_15eu_sl:
    role: finetune_only
    source: { kind: raw, keys: [twitter_sentiment_15eu] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [negative, neutral, positive]
    suite: null
    language: sl
    license: cc-by-4.0

  # --- SuperGLUE-SL subtasks --------------------------------------------
  nli/cb:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [entailment, neutral, contradiction]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  nli/rte:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [entailment, not_entailment]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  qa/boolq:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  qa/multirc:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  coref/wsc:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  wsd/wic:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  commonsense/copa:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [0, 1]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0
