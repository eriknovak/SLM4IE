# tasks.yaml — Registry of <task>/<dataset> fine-tuning + evaluation targets.
#
# Pipeline: to_spans.py / to_sentiment.py / to_superglue.py
#           extracted/<key>.jsonl | raw/<key>/ -> tasks/<task>/<dataset>/<split>.jsonl.gz
#           Output schemas are the task-family TypedDicts in slm4ie/data/schema.py.
#
# Top-level keys:
#   roots        extracted / raw / tasks — path roots for I/O.
#   mlflow       Tracking for task conversion (see Notes: mlflow).
#   converters   Default converter script per task family.
#   entries      Map of <task>/<dataset> -> entry spec. The key IS the output dir.
#
# Entry fields:
#   role         finetune_and_eval | held_out — enforces train/test isolation.
#                held_out drops the train split (writes only val/test); the
#                converter never emits a train.jsonl.gz for a held_out entry.
#   source       kind (extracted | raw) + keys (source dataset keys).
#   splits       Split name -> output filename.
#   labels       Label set for the task.
#   suite        Parent benchmark suite, or null.
#   language     ISO language code.
#   license      Dataset license identifier.
#
# Notes:
#   converter    Per entry defaults from the `converters` map by task family;
#     override with a per-entry `converter:` field.
#   mlflow       When enabled, one run per <task>/<dataset> is upserted to
#     `experiment` (keyed by a content digest of the dataset's split files):
#     per-split row counts + label distribution as metrics, a
#     label_distribution.json artifact, and the dataset as a `produced` input.
#
# Selection: pass <task>/<dataset> entry keys positionally, or --all.

# Roots for resolving source paths and writing output.
roots:
  extracted: ./data/extracted
  tasks: ./data/tasks
  raw: ./data/raw

# --- MLflow -------------------------------------------------------------
mlflow:                           # see Notes: mlflow
  enabled: false                  # opt in per run; toggle --mlflow / --no-mlflow
  experiment: slm4ie/data/tasks
  tracking_uri: null              # null -> $MLFLOW_TRACKING_URI -> sqlite fallback

# Default converter per task family; override per entry with `converter:`.
converters:
  ner: to_spans
  sentiment: to_sentiment
  nli: to_superglue
  qa: to_superglue
  coref: to_superglue
  wsd: to_superglue
  commonsense: to_superglue

# Per <task>/<dataset> entries. The key IS the directory under tasks/.
entries:
  # --- Sequence labeling & classification -------------------------------
  ner/ssj500k:
    role: finetune_and_eval
    source: { kind: extracted, keys: [ssj500k] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [PER, LOC, ORG, MISC]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  ner/suk:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: extracted, keys: [suk] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [PER, LOC, ORG, MISC, DERIV-PER]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  sentiment/sentinews:
    role: finetune_and_eval
    source: { kind: extracted, keys: [sentinews] }
    splits: { train: train.jsonl.gz, val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [negative, neutral, positive]
    suite: null
    language: sl
    license: cc-by-sa-4.0

  sentiment/twitter_15eu_sl:
    role: held_out
    source: { kind: raw, keys: [twitter_sentiment_15eu] }
    splits: { test: test.jsonl.gz }
    labels: [negative, neutral, positive]
    suite: null
    language: sl
    license: cc-by-4.0

  # --- SuperGLUE-SL subtasks --------------------------------------------
  nli/cb:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [entailment, neutral, contradiction]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  nli/rte:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [entailment, not_entailment]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  qa/boolq:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  qa/multirc:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  coref/wsc:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  wsd/wic:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [true, false]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0

  commonsense/copa:
    role: held_out               # held_out -> train dropped (val/test only)
    source: { kind: raw, keys: [superglue_sl] }
    splits: { val: val.jsonl.gz, test: test.jsonl.gz }
    labels: [0, 1]
    suite: superglue_sl
    language: sl
    license: cc-by-4.0
