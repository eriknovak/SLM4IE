# classifier-lexicon.yaml — one marker-word list per domain, and the rule that reads them (M2).
#
# Read by: slm4ie/data/curate/inspect/domains.py::load_lexicons
#
# Every document is scored per domain as the weighted number of marker hits per
# thousand words. The highest domain is assigned when its score is at least
# `threshold` and leads the runner-up by at least `margin`; otherwise the
# document keeps its source's label, mapped through `fallback` when that label
# is not one of the thirteen (D2).
#
# An entry ending in `*` is a prefix and matches every word starting with it;
# any other entry matches the whole word. Matching is lowercase. A word that
# hits several entries of one domain counts once there, at the strongest.
#
# The lists were seeded from the words most distinctive of each judge domain on
# the tune half of the judged gold (log-odds against the other domains), then
# pruned by hand: words that name the domain's subject or its genre stay,
# words that merely reflect the sample (one source's name or boilerplate, one
# text's topic) go, so the gate measures the domain and not the source. The `strong` tier holds words that almost only occur in that domain;
# `weak` holds words common there but seen elsewhere too.

weights:
  strong: 3
  weak: 1

# Threshold and margin are the tune-side pick of the M3 grid (tables/classifier-lexicon-gate-by-rule.csv).
rule:
  threshold: 60     # weighted hits per thousand words the leader must reach
  margin: 15        # lead over the runner-up it must hold
  min_words: 50     # shorter texts keep their source label: one strong hit would clear the threshold alone

# Source labels outside the thirteen judge labels and the label they count as.
fallback:
  mixed: other

