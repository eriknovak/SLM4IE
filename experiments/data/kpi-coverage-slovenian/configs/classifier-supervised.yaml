# The supervised domain classifiers tried when the lexicon classifier fails
# its gate (D3): one logistic regression over the thirteen judge labels, fitted
# on the tune side of the judged gold, with one of two feature backends (M4).
# Each candidate is read on the test side once, with the saved model.

max_chars: 2000                   # characters read per text, the length the gold was cut to before judging
folds: 5                          # cross-validation folds on the tune side that pick the regularisation
workers: 5                        # folds fitted at once
seed: 20261020                    # fold assignment
regularisation: [1, 3, 10, 30]    # inverse regularisation strength C of the logistic regression, tried in turn
max_iterations: 3000              # solver iterations before the fit is declared not converged

candidates:
  tfidf:                          # word and character n-grams, CPU only
    features: tfidf
    word_ngrams: [1, 2]           # shortest and longest word n-gram
    char_ngrams: [3, 5]           # shortest and longest character n-gram, inside word boundaries
    min_df: 2                     # documents an n-gram must occur in to be kept
    max_features: 300000          # most frequent n-grams kept, per n-gram kind
  embeddings:                     # one sentence-embedding vector per document, on a GPU where there is one
    features: embeddings
    model: intfloat/multilingual-e5-small
    revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3   # the hub commit loaded, so the vectors stay the same
    prefix: "query: "             # the e5 models expect this before every text
    batch_size: 64
    max_length: 512               # tokens read per document; the rest is cut
