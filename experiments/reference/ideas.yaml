  title: Send a calibrated GLiNER model's uncertain spans to Claude
  url: https://github.com/eriknovak/SLM4IE/issues/58
- body: '## Why


    The medical data labels spans with OMOP (Observational Medical Outcomes Partnership) domains such
    as Observation, Measurement and Procedure. The bare names are vague and overlap, and medical mentions
    often nest or fit two domains. A model trained on bare names and flat spans may miss the inner spans
    and the second domain, and cannot tell close domains apart.


    ## Step


    Training data and decoding: the prompt carries a description per domain, and the spans may nest or
    carry several domains


    ## Touches


    - gliner-features/label-descriptions | changes | Where it sits, describe step | write one description
    per OMOP domain into the annotation guide and keep it in every training example | close domains are
    confused less often

    - gliner-features/nested-multi-label | changes | Where it sits, decode step | annotate and decode
    nested spans and spans with two domains | inner mentions and second domains are found

    - gliner-features/training-losses | changes | Options row | keep binary cross-entropy or focal loss,
    which score each domain on its own, instead of cross-entropy over domains | multi-label scores stay
    independent

    - gliner-features/entity-vectors | changes | Where it sits, link step | return span vectors and link
    each medical span to its nearest OMOP concept as a follow-up | a first measure of concept linking

    - gliner-features/prompt-compression | does not apply | — | a compressed prompt cannot hold descriptions
    | —

    - gliner-features/confidence-calibration | does not apply | — | independent of how the data is labelled
    | —

    - gliner-features/onnx-export | does not apply | — | a deployment step, after this one | —

    - gliner-features/streaming-span | does not apply | — | the backbone is chosen elsewhere | —

    - gliner-features/relation-extraction | does not apply | — | the medical data marks spans, not relations
    | —

    - gliner-features/multitask-pipelines | does not apply | — | NER only | —

    - gliner-features/bi-encoder-labels | does not apply | — | a handful of domains needs no label cache
    | —

    '
