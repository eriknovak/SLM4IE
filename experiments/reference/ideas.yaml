- body: '## Why


    The backbone comparison asks whether a small decoder LLM can carry a Slovene GLiNER head. The library
    documents only one design on a decoder-only LLM, the streaming span model on Qwen3-0.6B. Without it,
    the decoder arm would need a head written in this project.


    ## Step


    Architecture: the GLiNER head on a causal decoder in place of a bidirectional encoder


    ## Touches


    - gliner-features/streaming-span | changes | Where it sits, attach step | train the streaming span
    head on Qwen3-0.6B, or a Slovene-adapted decoder, on the same span data as the encoder arms, and score
    it on whole texts | a decoder arm under the one-billion parameter limit

    - gliner-features/training-losses | changes | Options row | use the same loss as the encoder arms
    | the arms differ only in backbone

    - gliner-features/onnx-export | does not apply | — | streaming models cannot be exported; the comparison
    states this as a deployment cost | —

    - gliner-features/confidence-calibration | does not apply | — | streaming models skip the learned
    head | —

    - gliner-features/entity-vectors | does not apply | — | a stateful session returns no vectors | —

    - gliner-features/label-descriptions | does not apply | — | every arm takes the same bare labels |
    —

    - gliner-features/nested-multi-label | does not apply | — | the benchmark sets stay flat | —

    - gliner-features/relation-extraction | does not apply | — | NER only | —

    - gliner-features/multitask-pipelines | does not apply | — | NER only | —

    - gliner-features/prompt-compression | does not apply | — | not supported for streaming models | —

    - gliner-features/bi-encoder-labels | does not apply | — | a separate architecture | —

    '
