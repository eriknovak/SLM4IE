- body: '## Why


    The targets of 8 GB of GPU memory and a low cost per document belong to the deployed model, but scores
    are usually measured on the full-precision training copy. Export drops the learned calibration head
    and the entity vectors, and int8 costs small models more accuracy than large ones, so the deployed
    form may score below what the record reports.


    ## Step


    Deployment: export, quantize and optionally compress each final model, then score the deployed form


    ## Touches


    - gliner-features/onnx-export | changes | Where it sits, export step | score each final model in full
    precision and as int8 ONNX, with peak memory and documents per second | span F1, memory and speed
    reported for the form users run

    - gliner-features/confidence-calibration | changes | Limits, no help after export | fold the global
    temperature into the exported threshold by hand | keeps part of the calibration after export

    - gliner-features/prompt-compression | changes | Where it sits, compress step | add a compressed variant
    of each domain model for its fixed types | a faster model for users who need no new labels

    - gliner-features/entity-vectors | does not apply | — | exported runtimes return no vectors | —

    - gliner-features/streaming-span | does not apply | — | streaming models cannot be exported | —

    - gliner-features/label-descriptions | does not apply | — | prompt content survives export unchanged
    | —

    - gliner-features/nested-multi-label | does not apply | — | decoding survives export unchanged | —

    - gliner-features/training-losses | does not apply | — | training is done before this step | —

    - gliner-features/relation-extraction | does not apply | — | NER models first | —

    - gliner-features/multitask-pipelines | does not apply | — | NER models first | —

    - gliner-features/bi-encoder-labels | does not apply | — | the label sets are small | —

    '
  number: 61
