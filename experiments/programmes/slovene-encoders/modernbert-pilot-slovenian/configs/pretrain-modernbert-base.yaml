model:
  name: flex_bert
  model_config:
    normalization: layernorm
    hidden_act: gelu
    vocab_size: 32000
    init_method: full_megatron
    num_hidden_layers: 22
    hidden_size: 768
    intermediate_size: 1152
    num_attention_heads: 12
    attention_layer: rope
    attention_probs_dropout_prob: 0.0
    attn_out_bias: false
    attn_out_dropout_prob: 0.1
    attn_qkv_bias: false
    bert_layer: prenorm
    embed_dropout_prob: 0.0
    embed_norm: true
    final_norm: true
    skip_first_prenorm: true
    embedding_layer: sans_pos
    loss_function: fa_cross_entropy
    loss_kwargs:
      reduction: mean
    mlp_dropout_prob: 0.0
    mlp_in_bias: false
    mlp_layer: glu
    mlp_out_bias: false
    norm_kwargs:
      eps: 1.0e-05
      bias: false
    head_pred_act: gelu
    activation_function: gelu
    padding: unpadded
    rotary_emb_dim: null
    rotary_emb_base: 10000.0
    rotary_emb_scale_base: null
    rotary_emb_interleaved: false
    allow_embedding_resizing: true
    sliding_window: 128
    global_attn_every_n_layers: 3
    unpad_embeddings: true
    compile_model: true
    masked_prediction: true
  pretrained_model_name: bert-base-uncased
  tokenizer_name: ../data/tokenizers/bpe-32000
  disable_train_metrics: true
model_size: base
dataset: slm4ie-pretrain
tokenizer: bpe-32000
run_tag: ''
run_name: modernbert-base_slm4ie-pretrain_bpe-32000
data_local: ../data/corpora/slm4ie-pretrain/bpe-32000
data_remote: null
max_seq_len: 1024
tokenizer_name: ../data/tokenizers/bpe-32000
mlm_probability: 0.3
count_padding_tokens: false
train_loader:
  name: text
  dataset:
    local: ../data/corpora/slm4ie-pretrain/bpe-32000
    remote: null
    split: train
    tokenizer_name: ../data/tokenizers/bpe-32000
    max_seq_len: 1024
    shuffle: true
    mlm_probability: 0.3
    streaming: false
  drop_last: true
  num_workers: 6
  sequence_packing: true
  batch_size_warmup_min_size: 96
  batch_size_warmup_tokens: 2_000_000_000tok
eval_loader:
  name: text
  dataset:
    local: ../data/corpora/slm4ie-pretrain/bpe-32000
    remote: null
    split: validation
    tokenizer_name: ../data/tokenizers/bpe-32000
    max_seq_len: 1024
    shuffle: false
    mlm_probability: 0.15
    streaming: false
  drop_last: false
  num_workers: 3
  sequence_packing: false
scheduler:
  name: warmup_stable_decay
  t_warmup: 2_000_000_000tok
  alpha_f: 0.0
  t_decay: 6_700_000_000tok
optimizer:
  name: decoupled_stableadamw
  lr: 0.0008
  betas:
  - 0.9
  - 0.98
  eps: 1.0e-06
  weight_decay: 1.0e-05
  filter_bias_norm_wd: true
  log_grad_norm: true
max_duration: 66_836_000_000tok
eval_interval: 500ba
global_train_batch_size: 4608
global_eval_batch_size: 1024
seed: 17
device_eval_batch_size: 128
device_train_microbatch_size: 96
precision: amp_bf16
progress_bar: false
log_to_console: true
console_log_interval: 100ba
callbacks:
  speed_monitor:
    window_size: 100
  lr_monitor: {}
  scheduled_gc: {}
  log_grad_norm:
    batch_log_interval: 10
  packing_efficiency:
    log_interval: 10
loggers:
  mlflow:
    experiment_name: mlm-pretraining/slm4ie-pretrain
    run_name: modernbert-base_slm4ie-pretrain_bpe-32000
    resume: true
    tags:
      model_type: modernbert-base
      model_version: modernbert-base_slm4ie-pretrain_bpe-32000
      run_type: single
      dataset: slm4ie-pretrain
      tokenizer: bpe-32000
      repo_commit: f27cda3f7f49b04aee8c8fce1b8171d3326c6b41
      host: e3black
      gpus: 2,3
save_interval: 500ba
save_num_checkpoints_to_keep: -1
save_folder: ../models/modernbert-base_slm4ie-pretrain_bpe-32000/checkpoints
autoresume: true
