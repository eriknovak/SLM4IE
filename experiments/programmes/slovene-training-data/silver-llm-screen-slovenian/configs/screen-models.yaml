# screen-models.yaml — The models round 1 screens, the judges that rate them, and the spend limits (D1, D2, D5).
#
# Read by: scripts/screen_silver_llms.py make | check | rate | sheet --configs-dir <its folder>
#          builds one OpenRouter backend per model through
#          slm4ie/evaluation/backends::get_backend("openrouter", ...).
#
# Top-level keys:
#   limits       Spend limits in US dollars, summed from the cost each call reports.
#   sampling     Settings held fixed for every screened model.
#   models       Map of variant name -> model spec. The name is the variant
#                declared in variants.yaml and names the model in every table.
#   judges       Map of judge name -> model spec, same fields as a model.
#
# Limit fields:
#   round_usd        Most a round may spend; the runner refuses the call that would pass it.
#   experiment_usd   Most all rounds may spend together.
#
# Sampling fields:
#   seed             Sent with every call to a model that accepts a seed.
#   temperature      Sent with every call to a model that accepts a temperature.
#   reasoning_effort Reasoning strength asked of every model, one level for all
#                    except a model whose spec names the level it supports.
#   max_tokens       Most tokens a reply may hold, reasoning included. The spend guard
#                    prices each call as if its reply used all of them.
#
# Model spec fields:
#   display_name     The model's product name, as the record's prose writes it.
#   model            The model's OpenRouter identifier.
#   family           The provider family; the person's rating sample is balanced over it (D2).
#   accepts_seed, accepts_temperature
#                    Optional, default true. False for a model OpenRouter lists without
#                    the setting: the backend asks only for providers that accept every
#                    setting sent, so sending it would leave the model no provider.
#   reasoning_effort Optional. The level sent in place of the fixed one, for a model
#                    that does not support the fixed level.
#   usd_per_million_input, usd_per_million_output
#                    List prices on 2026-11-20, for the dry-run projection only.
#                    The spend that counts is the cost each call reports.
#
# Notes:
#   The reference model of the shortlist rule (D7) is the costliest screened
#   model, read from the output price here.
#   The settings each model accepts and its reasoning levels are OpenRouter's
#   model listing of 2026-11-27. Mistral Large 4 supports only high or no
#   reasoning; OpenRouter turns a low request into high, so it runs at high.
#   Claude models ignore a reasoning-token limit, so the effort level is the
#   one reasoning setting held across all models.

limits:
  round_usd: 30
  experiment_usd: 110

sampling:
  seed: 13
  temperature: 0.0
  reasoning_effort: low
  max_tokens: 16000

models:
