# briefs-passages.yaml — Round 1's writing briefs, one derived from each real passage (D3).
#
# Read by: scripts/screen_silver_llms.py preview | make | check | rate --configs-dir <its folder>
#          each brief fills the writing prompt (prompts-jobs.yaml).
#
# Top-level keys:
#   briefs       List of brief specs, in passage order.
#
# Brief spec fields:
#   brief_id     Name of the brief, stored on every written example.
#   passage_id   The real passage the brief is paired with; both share the text
#                type, the topic and the length, and none of the wording.
#   domain       `medical` or `scientific`; picks the label set.
#   text_type    What kind of text to write and where it would appear.
#   topic        What the text is about, in English so that no Slovene phrasing
#                is handed to the model.
#   words        Target length in words, the paired passage's length rounded to ten.
#   labels       Labels the text must contain at least one mention of.
#
# Notes:
#   Across each domain's ten briefs every label of the domain is asked for at
#   least once, so the rule check on label coverage can be read per label.

